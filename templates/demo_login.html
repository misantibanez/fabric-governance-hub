<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric Governance Hub Demo</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f2f1; color: #242424; font-family: "Segoe UI", sans-serif; }
        main { width: min(420px, calc(100% - 32px)); background: #fff; border: 1px solid #d1d1d1; border-top: 5px solid #0078d4; padding: 32px; box-shadow: 0 12px 36px rgba(0, 0, 0, .12); }
        h1 { margin: 0 0 8px; font-size: 26px; }
        p { margin: 0 0 24px; color: #616161; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input { width: 100%; min-height: 42px; border: 1px solid #8a8886; padding: 8px 10px; font: inherit; }
        button { width: 100%; min-height: 42px; margin-top: 24px; border: 0; background: #0078d4; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        .error { border-left: 3px solid #d13438; padding-left: 10px; color: #a4262c; }
    </style>
</head>
<body>
    <main>
        <h1>Fabric Governance Hub</h1>
        <p>Sign in to the isolated sample-data environment.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="return_to" value="{{ return_to }}">
            <label for="username">Demo user</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
